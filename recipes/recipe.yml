# Syntax: https://blue-build.org/reference/recipe/
# yaml-language-server: $schema=https://raw.githubusercontent.com/blue-build/cli/main/pkg/recipe-schema.json

name: blueland
description: Custom Bluefin base with Hyprland configuration alongside COSMIC
base-image: ghcr.io/ublue-os/bluefin-dx-nvidia-open
image-version: 43

modules:
  # Install comprehensive Hyprland ecosystem
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/solopasha/hyprland/repo/fedora-%OS_VERSION%/solopasha-hyprland-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/ryanabx/cosmic-epoch/repo/fedora-%OS_VERSION%/ryanabx-cosmic-epoch-fedora-%OS_VERSION%.repo
      #- https://copr.fedorainfracloud.org/coprs/materka/wallust/repo/fedora-41/materka-wallust-fedora-41.repo  # ← Hardcoded to 41
    install:
      - cosmic-desktop
      #- sddm
      
      
      # Wayland essentials
     
      - xdg-desktop-portal-gtk
   
      - qt5-qtwayland
      - qt6-qtwayland
      
      
      
      
      # Audio
      - pavucontrol
      - pamixer
      - playerctl
      #- wireplumber
      #- pipewire
      #- easyeffects
      
      # Network
      - network-manager-applet
      - blueman
      
      # System Monitoring
      - btop
      - htop
  
      # Archive Tools
      - file-roller
      #- p7zip  #already included in bluefin, created dependency conflict, not nescessary
      - unzip
      - unrar
      

      # Python dependencies for JaKooLit scripts
      - python3-pip
      - python3-pillow
      - python3-requests
      - python3-pyquery
      
      # Additional Utilities
      - jq
      - wget
      - curl
      - rsync
      - ripgrep
      - fd-find
      - fzf
      #- eza
      - bat
      - yad
      - wtype
      - ydotool
      - nm-connection-editor
      - kde-connect 
    

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
        - FiraCode
        - Hack
        - SourceCodePro
        - NerdFontsSymbolsOnly
        - Meslo
        - VictorMono
        - FantasqueSansMono
      google-fonts:
        - Roboto
        - Open Sans
        - Inter


  # Set up systemd services
  - type: systemd
    system:
      enabled:
        - gdm.service
        - bluetooth.service  
      disabled:
        - sddm.service
